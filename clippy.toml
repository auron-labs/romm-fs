too-many-lines-threshold = 100
cognitive-complexity-threshold = 15
type-complexity-threshold = 200
doc-valid-idents = ["LLM", "AI", "API", "CLI", "TUI", "AST", "MCP", "DSPy", "PTY", "JIT", "FFI", "JSON", "TOML", "UUID", "URL", "HTTP", "HTTPS", "TCP", "UDP", "WebSocket", "OAuth", "JWT"]

[[await-holding-invalid-types]]
path = "tracing::span::Entered"
reason = "`Entered` is not aware when a function is suspended: https://docs.rs/tracing/latest/tracing/struct.Span.html#in-asynchronous-code"

[[await-holding-invalid-types]]
path = "tracing::span::EnteredSpan"
reason = "`EnteredSpan` is not aware when a function is suspended: https://docs.rs/tracing/latest/tracing/struct.Span.html#in-asynchronous-code"

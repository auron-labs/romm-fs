[tools]
betterleaks = "1.9.0"
"cargo:cargo-deny" = "0.20.2"
"github:rui314/mold" = "3.0.0"
hk = { version = "2.6.0", workflow = "release.yml" }
"npm:dclint" = "3.1.0"
pkl = "0.32.1"
tombi = "1.8.4"

[tools.rust]
version = "1.99.0"
components = "clippy,rustfmt"

[vars]
cargo_args = "--workspace{% if os() != 'windows' %} --no-default-features{% endif %} --all-targets --locked"

[tasks]
"check:rust" = "cargo check {{vars.cargo_args}}"
"fix:rust" = "cargo fix {{vars.cargo_args}} --allow-dirty --allow-staged"
lint = "cargo clippy {{vars.cargo_args}}"
"lint:fix" = "cargo clippy {{vars.cargo_args}} --fix --allow-dirty --allow-staged"
test = "cargo test {{vars.cargo_args}} -- --test-threads=1"
"test:portable" = "cargo test --locked -p rommfs-core -p rommfs-fixture -p rommfs-cfapi -p rommfs-app --no-default-features -- --test-threads=1"
"check:ui" = "cargo check --locked -p rommfs-app --all-targets"
"test:native" = "{% if os() == 'windows' %}cargo test --locked --workspace -- --test-threads=1{% else %}echo 'test:native requires a native Windows host; refusing to run' && false{% endif %}"
fmt = "cargo fmt --all"
"fmt:check" = "cargo fmt --all --check"
check = "hk check --all"
fix = "hk fix"
"hooks:install" = "hk install --mise"

[env]
BETTERLEAKS_CONFIG = "{{ config_root }}/.betterleaks.toml"

[licenses]
# Explicitly allow the permissive licenses used by the locked dependency graph.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "NCSA",
  "Unicode-3.0",
  "Zlib",
]
exceptions = [
  { crate = "cbindgen", allow = ["MPL-2.0"] },
  { crate = "dwrote", allow = ["MPL-2.0"] },
  { crate = "option-ext", allow = ["MPL-2.0"] },
]

[advisories]
# Upstream dependencies own these replacements; still reject vulnerabilities
# throughout the graph and unmaintained direct dependencies.
unmaintained = "workspace"

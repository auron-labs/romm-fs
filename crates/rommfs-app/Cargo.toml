[package]
name = "rommfs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rommfs-app"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
# gpui-kit = GPUI + gpui-base + gpui-component + default icon assets.
gpui-kit = { workspace = true, optional = true }
gpui-mcp = { git = "https://github.com/themixednuts/gpui-mcp", rev = "eb248ccf43847797b9067c47eeef1dd188dc03a6", default-features = false, features = ["gpui-pre"], optional = true }
httpdate.workspace = true
notify.workspace = true
rommfs-cfapi.workspace = true
rommfs-core.workspace = true
tempfile.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rommfs-fixture.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[build-dependencies]
winresource = "0.1.31"

# Windows-only platform APIs
[target."cfg(windows)".dependencies]
raw-window-handle = "0.6"
tray-icon = { version = "0.26.1", default-features = false }
windows-sys = { workspace = true, features = ["Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[features]
default = ["ui"]
ui = ["dep:gpui-kit"]
# Local automation is opt-in and the bridge is installed only in debug builds.
mcp = ["ui", "dep:gpui-mcp"]

[package]
name = "rommfs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "rommfs-app"
path = "src/main.rs"
required-features = ["ui"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
# gpui-kit = GPUI + gpui-base + gpui-component + default icon assets.
gpui-kit = { workspace = true, optional = true }
httpdate.workspace = true
notify.workspace = true
rommfs-cfapi.workspace = true
rommfs-core.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rommfs-fixture.workspace = true
serde_json.workspace = true
tempfile.workspace = true

# Windows-only platform APIs
[target."cfg(windows)".dependencies]
windows-sys.workspace = true

[features]
default = ["ui"]
ui = ["dep:gpui-kit"]
